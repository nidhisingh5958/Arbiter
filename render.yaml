# Render Blueprint — one Docker web service (API + SPA, same origin so SSE and
# PayPal webhooks just work) plus managed Postgres.
# Deploy: Render dashboard → New → Blueprint → select this repo.
# Webhook URL to register in PayPal: https://<service>.onrender.com/api/webhooks/paypal

services:
  - type: web
    name: arbiterai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: 'true'
      - key: DATABASE_URL
        fromDatabase:
          name: arbiterai-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'false'
      - key: APP_SECRET
        generateValue: true
      # PUBLIC_WEB_URL defaults to RENDER_EXTERNAL_URL (set automatically by Render).
      - key: LLM_MODE
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: PAYPAL_MODE
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_PAYOUT_RECEIVER_EMAIL
        sync: false
      - key: ESCROW_MODE
        value: capture_then_payout
      - key: GITHUB_MODE
        value: live
      - key: GITHUB_TOKEN
        sync: false
      - key: POLICY_DISPUTE_WINDOW_SECONDS
        value: '45'

databases:
  - name: arbiterai-db
    plan: free
    databaseName: arbiter
    user: arbiter
